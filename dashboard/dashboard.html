<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://youglish.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: https://translate.google.com https://*.googlevideo.com; connect-src 'self' data: blob: https://qnutoswrufznztoznlql.supabase.co https://translate.google.com https://translate.googleapis.com https://api.mymemory.translated.net https://api.allorigins.win https://cdn.jsdelivr.net https://huggingface.co https://*.huggingface.co https://*.hf.co; worker-src 'self' blob:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://youglish.com; object-src 'none'; base-uri 'self';" />
    <title>LinguaFlow</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/icon48.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://qnutoswrufznztoznlql.supabase.co">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" /></noscript>
    <link rel="stylesheet" href="css/globals.css?v=editorial-114" />
    <link rel="stylesheet" href="css/editorial.css?v=114" />
  </head>
  <body class="lf-auth-pending">
    <!-- Top Navigation Bar -->
    <header class="topbar">
      <div class="logo">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" focusable="false"><path d="M4 11.5 16 5l12 6.5-12 6.4L4 11.5Z"/><path d="M9 15.2v6.1c4.1 3.1 9.9 3.1 14 0v-6.1M28 12v8"/></svg>
        </span>
        <span class="editorial-wordmark">Lingua<span>Flow</span></span>
      </div>
      <nav class="nav-links">
        <button class="nav-btn active" type="button" data-route="home">Hoje</button>
        <button class="nav-btn" type="button" data-route="learn" data-nav-group="learn">Aprender</button>
        <button class="nav-btn" type="button" data-route="library">O Cofre</button>
        <button class="nav-btn" type="button" data-route="progress" data-nav-group="progress">Progresso</button>
      </nav>
      <div class="topbar-actions">
        <button id="topbar-search-btn" class="topbar-icon-btn" type="button" aria-label="Buscar no cofre" title="Buscar no cofre">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 5 5"/></svg>
        </button>
        <span class="topbar-divider" aria-hidden="true"></span>
        <div class="profile-menu-wrap">
          <button id="profile-menu-toggle" class="profile-menu-toggle" type="button" aria-label="Abrir menu do perfil" aria-haspopup="menu" aria-expanded="false" title="Perfil">A<span class="profile-status" aria-hidden="true"></span></button>
          <div id="profile-menu" class="profile-menu" role="menu" hidden>
            <button type="button" role="menuitem" data-route="settings">Configurações</button>
            <button type="button" role="menuitem" id="theme-toggle-btn">Alternar tema</button>
            <button type="button" role="menuitem" class="btn-logout" id="logout-btn">Sair</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Shell mínimo da sessão: a rota Estudo esconde a navegação global e
         mantém somente saída, estado da sessão e acessos secundários. -->
    <header id="study-focus-header" class="study-focus-header" hidden aria-label="Controles da sessão de estudo">
      <button id="study-focus-exit" class="study-focus-icon-btn" type="button" aria-label="Sair da sessão e voltar ao início">Sair</button>
      <div class="study-focus-progress" role="status" aria-live="polite">
        <strong>Sessão de estudo</strong>
        <span id="study-focus-status">Um card por vez</span>
        <div id="study-focus-track" class="study-focus-track" role="progressbar" aria-label="Progresso da sessão" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
      </div>
      <div class="study-focus-menu-wrap">
        <button id="study-focus-menu-toggle" class="study-focus-icon-btn" type="button" aria-label="Abrir menu da sessão" aria-haspopup="menu" aria-expanded="false">⋯</button>
        <div id="study-focus-menu" class="study-focus-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-focus-route="home">Início</button>
          <button type="button" role="menuitem" data-focus-route="library">O Cofre</button>
          <button type="button" role="menuitem" data-focus-route="settings">Configurações</button>
        </div>
      </div>
    </header>

    <!-- Main Content Area (Views are injected here) -->
    <main id="app-root"></main>

    <nav id="mobile-nav" class="mobile-nav" aria-label="Navegação principal">
      <button class="mobile-nav-btn active" type="button" data-route="home"><span aria-hidden="true">⌂</span><span>Hoje</span></button>
      <button class="mobile-nav-btn" type="button" data-route="learn" data-nav-group="learn"><span aria-hidden="true">▶</span><span>Aprender</span></button>
      <button class="mobile-nav-btn" type="button" data-route="library"><span aria-hidden="true">◇</span><span>Cofre</span></button>
      <button class="mobile-nav-btn" type="button" data-route="progress" data-nav-group="progress"><span aria-hidden="true">↗</span><span>Progresso</span></button>
    </nav>

    <!-- Global Toast Container -->
    <div id="toast-container"></div>

    <script type="module" src="js/core/app.js?v=3.0.54"></script>
  </body>
</html>
