<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar na extensão — LinguaFlow</title>
    <style>
      :root { --color-primary:#2052c4; --color-primary-dark:#183e96; --color-secondary:#2052c4; --color-danger:#a93232; --color-text:#18263b; --color-text-light:#627086; --color-border:#dcdedc; --color-bg:#fcfbf8; --color-surface:#fff; }
      * { box-sizing:border-box; }
      body { width:340px; margin:0; padding:26px 24px 22px; background:var(--color-bg); color:var(--color-text); font:14px/1.5 system-ui,sans-serif; }
      .popup-card { width:100%; }
      .header { padding-bottom:18px; border-bottom:1px solid var(--color-border); margin-bottom:18px; }
      .header h1 { margin:0; font:400 29px/1.2 Georgia,serif; letter-spacing:-1px; }
      .header p { margin:5px 0 0; font-size:12px; }
      p { color:var(--color-text-light); }
      .hidden { display:none!important; }
      label { display:block; font-size:12px; margin-bottom:5px; }
      input { width:100%; padding:12px; border:1px solid var(--color-border); border-radius:5px; font:inherit; margin-bottom:14px; background:var(--color-surface); color:var(--color-text); }
      .btn { width:100%; min-height:46px; padding:12px 16px; border:1px solid transparent; border-radius:5px; font:600 14px system-ui,sans-serif; cursor:pointer; transition:background-color .15s,transform .1s; }
      .btn-primary { background:var(--color-primary); color:#fff; margin-bottom:10px; }
      .btn-primary:hover { background:var(--color-primary-dark); }
      .btn-secondary { background:transparent; border-color:var(--color-border); color:var(--color-primary); }
      .btn-secondary:hover { background:#e9eefb; }
      .btn:active { transform:translateY(1px); }
      .btn:disabled { opacity:.6; cursor:wait; }
      .btn-ghost { background:none; border:0; color:var(--color-text-light); font:inherit; min-height:44px; cursor:pointer; padding:8px 0; }
      .btn-ghost:hover { color:var(--color-danger); }
      button:focus-visible,input:focus-visible { outline: 3px solid var(--color-secondary); outline-offset:3px; }
      .error { color:var(--color-danger); font-size:13px; }
      .user-chip { font-size:12px; color:var(--color-text-light); overflow-wrap:anywhere; margin-bottom:20px; }
      .study-card { margin-bottom:22px; }
      .study-card-header { display:flex; justify-content:space-between; gap:8px; font-size:12px; margin-bottom:16px; }
      .study-badge { font-weight:600; }
      .streak-badge { color:var(--color-text-light); }
      .metrics-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--color-border); }
      .metric-info { display:flex; flex-direction:column; gap:7px; }
      .metric-label { font-size:11px; color:var(--color-text-light); }
      .metric-value { font:400 26px/1.2 Georgia,serif; }
      .cards-due-box { padding-top:14px; font-size:13px; }
      .tip { font-size:11px; border-top:1px solid var(--color-border); margin:14px 0 0; padding-top:14px; }
      body.is-tab-mode { width:100%; min-height:100vh; display:grid; place-items:center; }
      body.is-tab-mode .popup-card { max-width:380px; }
      @media(prefers-reduced-motion:reduce) { * { transition:none!important; } }
    </style>
  </head>
  <body>
    <div class="popup-card">
      <div class="header">
        <h1>LinguaFlow</h1>
        <p>Seu inglês, em contexto.</p>
      </div>

      <!-- Estado: carregando -->
      <div id="area-loading">
        <p>Carregando…</p>
      </div>

      <!-- Estado: deslogado (login próprio da extensão) -->
      <div id="area-login" class="hidden">
        <p>Entre para salvar palavras, usar a IA e sincronizar seu progresso.</p>
        <form id="login-form">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" autocomplete="email" required />
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
          <div id="login-error" class="error" role="alert" aria-live="polite"></div>
          <button type="submit" id="btn-login" class="btn btn-primary">Entrar</button>
        </form>
        <button id="btn-signup-link" class="btn btn-secondary">Criar conta no site</button>
      </div>

      <!-- Estado: logado -->
      <div id="area-logged" class="hidden">
        <div class="user-chip" id="user-email"></div>

        <div class="study-card">
          <div class="study-card-header">
            <span class="study-badge" id="study-lang-badge">Inglês</span>
            <span class="streak-badge" id="streak-badge" title="Dias seguidos de estudo"><span id="streak-count">0</span> dias seguidos</span>
          </div>

          <div class="metrics-grid">
            <div class="metric-item">
              <div class="metric-info">
                <span class="metric-label">Listening hoje</span>
                <span class="metric-value" id="listening-today">0m</span>
              </div>
            </div>

            <div class="metric-item">
              <div class="metric-info">
                <span class="metric-label">Listening total</span>
                <span class="metric-value" id="listening-total">0h</span>
              </div>
            </div>
          </div>

          <div class="cards-due-box" id="cards-due-box">
            <span id="due-cards-text">Você tem <strong id="due-cards-count" style="color:var(--color-secondary);">0</strong> frases para revisar</span>
          </div>
        </div>

        <div id="stats-text" class="hidden" role="status" aria-live="polite"></div>
        <button id="btn-dash" class="btn btn-primary">Abrir dashboard</button>
        <button id="btn-logout" class="btn-ghost">Sair da conta</button>
      </div>

      <p class="tip">
        Pressione <strong>O</strong> em um vídeo para capturar uma frase.
      </p>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
